name: Fix v0.8 confirmed invalidation

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply confirmed invalidation state fix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('tradingview/AuctionAI_v0_8.pine')
          s = p.read_text(encoding='utf-8')
          old = '''invalidationCandidateConfirmed = invalidationCandidateCount >= invalidationCandidateBars\n\n// Recovery: a deteriorating decision can recover without passing through INVALIDATED.'''
          new = '''invalidationCandidateConfirmed = invalidationCandidateCount >= invalidationCandidateBars\n\n// Confirmed invalidation is a real Decision State, not only a diagnostic flag.\nif invalidationCandidateConfirmed and (decisionState == DEC_LONG or decisionState == DEC_SHORT)\n    decisionState := DEC_INVALID\n    decisionAge := 0\n    invalidationCandidateCount := 0\n\n// Recovery: a deteriorating decision can recover without passing through INVALIDATED.'''
          if old not in s:
              raise SystemExit('Expected v0.8 invalidation block not found; no changes made.')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit fix and remove temporary workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tradingview/AuctionAI_v0_8.pine
          git commit -m 'fix(v0.8): make confirmed invalidation a decision state'
          git rm .github/workflows/fix-v08-invalidation.yml
          git commit -m 'chore: remove temporary v0.8 fix workflow'
          git push
